# riscv-formal configuration for rv_core (RV32IMC, machine mode)
[options]
isa rv32imc
solver yices

[depth]
insn            12
reg        8    12
pc_fwd     8    12
pc_bwd     8    16
unique     1  8  16
causal     8    16
ill             12
cover      1    14

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RVCORE_FORMAL_SMALL_BP

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rtl/rv_alu.v
@basedir@/cores/@core@/rtl/rv_csr.v
@basedir@/cores/@core@/rtl/rv_decode.v
@basedir@/cores/@core@/rtl/rv_frontend.v
@basedir@/cores/@core@/rtl/rv_muldiv.v
@basedir@/cores/@core@/rtl/rv_regfile.v
@basedir@/cores/@core@/rtl/rv_rvc_expand.v
@basedir@/cores/@core@/rtl/rv_core.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
